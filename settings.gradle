pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()

		exclusiveContent {
			forRepository {
				maven {
					name = 'Fabric'
					url = uri('https://maven.fabricmc.net')
				}
			}
			filter {
				includeGroupAndSubgroups('net.fabricmc')
				includeGroup('fabric-loom')
			}
		}

		// ModDev 插件与 NeoForge 本体都只发布在官方仓库，没有第三方全量同步。
		// 官方域名在国内通常被 TCP 重置（curl 直接拿到 000），
		// neoforged.forgecdn.net 是它自己的 CDN 分流域名、可直连，所以优先走它。
		maven {
			name = 'NeoForgeCDN'
			url = uri('https://neoforged.forgecdn.net/releases')
		}
		maven {
			name = 'NeoForge'
			url = uri('https://maven.neoforged.net/releases')
		}
	}
}

rootProject.name = 'randomcapes'

// common/ 不是 Gradle 项目：它只是一份共享源码，由下面两个加载器各自引进去编译。
include('fabric')
include('neoforge')
