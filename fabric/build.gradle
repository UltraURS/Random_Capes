plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Mod Menu 是可选的运行时依赖，它只提供模组列表里的「Config」挂载点。
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

// 产物名：randomcape-fabric-<version>.jar（默认只会叫 fabric-<version>.jar，看不出是哪个模组）
base {
	archivesName = "${mod_id}-${project.name}"
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"

	// Fabric API。技术上可选，但这里用到了它的生命周期事件，实际是必需的。
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Mod Menu。装了它才会在模组列表里出现配置入口；没装本模组照样能跑，
	// 只是没有地方可以打开配置界面。
	implementation "com.terraformersmc:modmenu:${modmenu_version}"
}

// 共享源码：common/ 里的代码不认识任何加载器，Fabric 与 NeoForge 各自把它编译一份。
sourceSets.main.java.srcDirs += file('../common/src/main/java')
sourceSets.main.resources.srcDirs += file('../common/src/main/resources')

loom {
	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(java_version)
	}

	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(java_version)
	targetCompatibility = JavaVersion.toVersion(java_version)
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = java_version as int
}

// Windows 命令行长度上限是 32767 字符。本项目路径较长（且含中文），完整依赖的 classpath
// 会越过这个上限，Gradle 只能把它压成一个 manifest jar。而 Fabric Loader 依赖真实的
// classpath 条目来做类加载器隔离，被压缩后 Knot 认不出真实 jar 列表，游戏启动即崩：
//   IllegalStateException: trying to load ...FabricLoaderImpl from target class loader
// 剔掉其它平台的原生库后 classpath 回到限制内，Loader 就恢复正常。
// 只影响 runClient 的本地开发运行，不会进入发布产物。
tasks.matching { it.name == 'runClient' }.configureEach {
	classpath = classpath.filter { f ->
		String name = f.name
		boolean foreignNatives =
				(name.contains('-natives-') && !name.endsWith('-natives-windows.jar')) ||
				(name.contains('native-epoll') && name.contains('linux')) ||
				(name.contains('native-kqueue') && name.contains('osx'))
		!foreignNatives
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
