# Gradle
# 模板默认的 -Xmx1G 不够：Loom 的 remap 阶段 daemon 会卡死在 ~1.05G。
org.gradle.jvmargs=-Xmx3G --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft
minecraft_version=26.3
java_version=25

# Mod Properties
version=1.0.1
group=com.example.randomcapes
mod_id=randomcapes

# Fabric
loader_version=0.19.5
loom_version=1.18.2
fabric_api_version=0.161.0+26.3
# 可选依赖：只用来在模组列表里挂出配置界面。
modmenu_version=21.0.0

# NeoForge
moddev_version=2.0.147
# https://neoforged.forgecdn.net/releases 上的最新版（官方 maven.neoforged.net 通常连不上）。
neoforge_version=26.3.0.31-beta

# 默认 JAVA_HOME 不是 25 时在这里指定，例如：
# org.gradle.java.home=D:/01-Applications/Java/jdk-25
