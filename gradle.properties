# Gradle
# 模板默认的 -Xmx1G 不够：Loom 的 remap 阶段 daemon 会卡死在 ~1.05G。
org.gradle.jvmargs=-Xmx3G --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft
minecraft_version=1.21.11
java_version=21

# Mod Properties
version=1.0.0
group=com.example.randomcapes
mod_id=randomcapes

# Fabric
loader_version=0.19.5
loom_version=1.14.10
fabric_api_version=0.141.6+1.21.11
# 可选依赖：只用来在模组列表里挂出配置界面。
modmenu_version=17.0.1

# NeoForge
moddev_version=2.0.147
# 与本目录 Minecraft 版本对应的 NeoForge；仓库使用 neoforged.forgecdn.net。
neoforge_version=21.11.45

# 默认 JAVA_HOME 不是 21 时在这里指定，例如：
# org.gradle.java.home=D:/01-Applications/Java/jdk-21
