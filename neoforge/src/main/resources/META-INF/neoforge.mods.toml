# NeoForge 的模组描述文件。写法见 https://docs.neoforged.net/docs/gettingstarted/modfiles
modLoader="javafml"
loaderVersion="[1,)"
license="CC0-1.0"
issueTrackerURL="https://github.com/UltraURS/Random_Capes/issues"

[[mods]]
modId="randomcapes"
